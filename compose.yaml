services:
  service-a:
    build: ./services/service-a
    environment:
      - PORT=5001
    ports:
      - "5001:5001"

  service-b:
    build: ./services/service-b
    environment:
      - PORT=5002
      - SERVICE_A_URL=http://service-a:5001
    ports:
      - "5002:5002"
    depends_on:
      - service-a

