services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      service-a:
        condition: service_started
      service-b:
        condition: service_started

  service-a:
    image: practika3-service-a:latest
    environment:
      - PORT=5001
    # ports:
    #   - "5001:5001"

  service-b:
    image: practika3-service-b:latest
    environment:
      - PORT=5002
      - SERVICE_A_URL=http://service-a:5001
    # ports:
    #   - "5002:5002"
    depends_on:
      - service-a

